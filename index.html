<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新大久保アイドル 好き顔9選</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: sans-serif;
      background: #fff5f8;
      color: #333;
      text-align: center;
    }

    header {
      padding: 30px 15px 15px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #888;
    }

    #game {
      max-width: 900px;
      margin: 20px auto;
      padding: 20px;
    }

    .choices {
      display: flex;
      justify-content: center;
      gap: 25px;
      flex-wrap: wrap;
    }

    .person {
      width: 300px;
      background: white;
      border: none;
      border-radius: 20px;
      padding: 12px;
      cursor: pointer;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
      transition: 0.2s;
    }

    .person:hover {
      transform: scale(1.03);
    }

    .person img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 15px;
    }

    .name {
      font-size: 20px;
      font-weight: bold;
      margin: 12px 0 5px;
    }

    .result {
      display: none;
    }

    .result-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      max-width: 600px;
      margin: 25px auto;
    }

    .result-card {
      background: white;
      border-radius: 15px;
      padding: 8px;
    }

    .result-card img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 10px;
    }

    .rank {
      font-weight: bold;
      margin: 5px;
    }

    button.restart {
      border: none;
      background: #ff6f9f;
      color: white;
      padding: 13px 25px;
      border-radius: 30px;
      font-size: 16px;
      cursor: pointer;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 23px;
      }

      .person {
        width: 42vw;
        min-width: 140px;
      }

      .choices {
        gap: 10px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>💗 新大久保アイドル 好き顔9選</h1>
  <div class="subtitle">あなたの好きな顔を選んでね！</div>
</header>

<div id="game">

  <h2 id="question">どっちの顔が好き？</h2>

  <div class="choices">

    <button class="person" onclick="choose(0)">
      <img id="image1" src="https://placehold.co/500x500?text=IDOL+A">
      <div class="name" id="name1">アイドルA</div>
    </button>

    <button class="person" onclick="choose(1)">
      <img id="image2" src="https://placehold.co/500x500?text=IDOL+B">
      <div class="name" id="name2">アイドルB</div>
    </button>

  </div>

</div>

<div id="result" class="result">

  <h2>🎀 あなたの好き顔9選 🎀</h2>

  <div class="result-grid" id="resultGrid"></div>

  <button class="restart" onclick="restart()">
    もう一度遊ぶ
  </button>

</div>

<script>

// ==============================
// ゲームに使う変数
// ==============================

let selectionPool = [];
let selectionWinners = [];
let selectionQueue = [];

let currentPair = [];

let selectionRound = 0;

let finalNine = [];

let ranking = [];
let rankingQueue = [];
let rankingTarget = null;
let rankingIndex = 0;

let gameMode = "selection";


// ==============================
// シャッフル
// ==============================

function shuffle(array) {
  return [...array].sort(() => Math.random() - 0.5);
}


// ==============================
// ゲーム開始
// ==============================

function startGame() {

  selectionPool = shuffle(idols);

  selectionWinners = [];
  selectionQueue = [];

  currentPair = [];

  selectionRound = 0;

  finalNine = [];

  ranking = [];
  rankingQueue = [];
  rankingTarget = null;
  rankingIndex = 0;

  gameMode = "selection";

  document.getElementById("game").style.display = "block";
  document.getElementById("result").style.display = "none";

  beginSelectionRound();
}


// ==============================
// 選抜ラウンド開始
// ==============================

function beginSelectionRound() {

  // 9人になったら順位決定へ
  if (selectionPool.length <= 9) {

    finalNine = shuffle(selectionPool);

    startRanking();

    return;
  }

  selectionRound++;

  selectionPool = shuffle(selectionPool);

  selectionWinners = [];

  let matchCount;

  // 18人より多い場合は普通の勝ち抜き
  if (selectionPool.length > 18) {

    matchCount = Math.floor(selectionPool.length / 2);

    // 奇数なら1人はシード
    if (selectionPool.length % 2 === 1) {

      const bye = selectionPool.pop();

      selectionWinners.push(bye);
    }

  } else {

    // 9人になるまで必要な人数だけ勝負
    matchCount = selectionPool.length - 9;

    const byeCount = selectionPool.length - matchCount * 2;

    for (let i = 0; i < byeCount; i++) {

      const bye = selectionPool.pop();

      selectionWinners.push(bye);
    }
  }

  selectionQueue = selectionPool.slice(0, matchCount * 2);

  showNextSelectionMatch();
}


// ==============================
// 次の選抜対決
// ==============================

function showNextSelectionMatch() {

  if (selectionQueue.length === 0) {

    // このラウンド終了
    selectionPool = [...selectionWinners];

    beginSelectionRound();

    return;
  }

  const person1 = selectionQueue.shift();
  const person2 = selectionQueue.shift();

  currentPair = [person1, person2];

  showPair(
    currentPair,
    `第${selectionRound}回戦　どっちの顔が好き？`
  );
}


// ==============================
// 画像と名前を表示
// ==============================

function showPair(pair, questionText) {

  document.getElementById("question").textContent = questionText;

  document.getElementById("image1").src = pair[0].image;
  document.getElementById("name1").textContent = pair[0].name;

  document.getElementById("image2").src = pair[1].image;
  document.getElementById("name2").textContent = pair[1].name;
}


// ==============================
// 「どっちが好き？」を選んだとき
// ==============================

function choose(number) {

  if (!currentPair[number]) {
    return;
  }

  // 選抜中
  if (gameMode === "selection") {

    const winner = currentPair[number];

    selectionWinners.push(winner);

    showNextSelectionMatch();

    return;
  }


  // 順位決定中
  if (gameMode === "ranking") {

    handleRankingChoice(number);

    return;
  }
}


// ==============================
// TOP9の順位決定開始
// ==============================

function startRanking() {

  gameMode = "ranking";

  ranking = [];

  rankingQueue = shuffle(finalNine);

  // 最初の1人を仮の1位にする
  ranking.push(rankingQueue.shift());

  rankingTarget = rankingQueue.shift();

  rankingIndex = 0;

  showNextRankingComparison();
}


// ==============================
// 順位決定の対決
// ==============================

function showNextRankingComparison() {

  // 全員の順位が決まった
  if (!rankingTarget) {

    showResult();

    return;
  }


  // 最後まで負けなかったら一番下
  if (rankingIndex >= ranking.length) {

    ranking.push(rankingTarget);

    moveToNextRankingTarget();

    return;
  }


  const currentRankPerson = ranking[rankingIndex];

  currentPair = [
    rankingTarget,
    currentRankPerson
  ];


  showPair(
    currentPair,
    `TOP9順位決定戦　どっちを上位にする？`
  );
}


// ==============================
// 順位決定で選んだとき
// ==============================

function handleRankingChoice(number) {

  // 左を選んだ
  // → 新しく順位を決めている人が上位

  if (number === 0) {

    ranking.splice(
      rankingIndex,
      0,
      rankingTarget
    );

    moveToNextRankingTarget();

    return;
  }


  // 右を選んだ
  // → 今いる人のほうが上位

  rankingIndex++;

  showNextRankingComparison();
}


// ==============================
// 次の順位決定へ
// ==============================

function moveToNextRankingTarget() {

  if (rankingQueue.length === 0) {

    rankingTarget = null;

    showResult();

    return;
  }

  rankingTarget = rankingQueue.shift();

  rankingIndex = 0;

  showNextRankingComparison();
}


// ==============================
// 結果表示
// ==============================

function showResult() {

  gameMode = "result";

  document.getElementById("game").style.display = "none";

  document.getElementById("result").style.display = "block";

  const grid = document.getElementById("resultGrid");

  grid.innerHTML = "";


  ranking.slice(0, 9).forEach((idol, index) => {

    const card = document.createElement("div");

    card.className = "result-card";

    card.innerHTML = `
      <div class="rank">${index + 1}位</div>
      <img src="${idol.image}">
      <div>${idol.name}</div>
    `;

    grid.appendChild(card);

  });
}


// ==============================
// もう一度遊ぶ
// ==============================

function restart() {

  startGame();

}


// ==============================
// 最初にゲーム開始
// ==============================

startGame();

</script>
